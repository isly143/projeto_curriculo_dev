<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login e Cadastro</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #ffd6e7,
                #e8d5ff
            );
        }

        .container {
            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .emoji {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            color: #d94f87;
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;

            text-align: left;

            margin-bottom: 6px;

            color: #555;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #d94f87;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background-color: #d94f87;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background-color: #bd3d70;

            transform: scale(1.02);
        }

        .link {
            margin-top: 20px;

            color: #777;
        }

        .link a {
            color: #d94f87;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;
        }

        .link a:hover {
            text-decoration: underline;
        }

        /* Esconde o cadastro inicialmente */
        #cadastro {
            display: none;
        }

    </style>

</head>

<body>
    <header>
        <p>Aqui é o cabeçalho</p>
    </header>


    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <div class="container" id="login">

        <div class="emoji">
            💗
        </div>

        <h1>
            Bem-vindo!
        </h1>

        <p class="subtitulo">
            Entre na sua conta
        </p>


        <form>

            <label>
                E-mail
            </label>

            <input
                type="email"
                placeholder="Digite seu e-mail"
                required
            >


            <label>
                Senha
            </label>

            <input
                type="password"
                placeholder="Digite sua senha"
                required
            >


            <button type="submit">
                Entrar
            </button>

        </form>


        <p class="link">

            Ainda não possui uma conta?

            <a onclick="mostrarCadastro()">
                Criar conta
            </a>

        </p>

    </div>



    <!-- ========================= -->
    <!-- CADASTRO -->
    <!-- ========================= -->

    <div class="container" id="cadastro">

        <div class="emoji">
            ✨
        </div>

        <h1>
            Criar conta
        </h1>

        <p class="subtitulo">
            Cadastre-se para continuar
        </p>


        <form>

            <label>
                Nome
            </label>

            <input
                type="text"
                placeholder="Digite seu nome"
                required
            >


            <label>
                E-mail
            </label>

            <input
                type="email"
                placeholder="Digite seu e-mail"
                required
            >


            <label>
                Senha
            </label>

            <input
                type="password"
                placeholder="Digite sua senha"
                required
            >


            <button type="submit">
                Cadastrar
            </button>

        </form>


        <p class="link">

            Já possui uma conta?

            <a onclick="mostrarLogin()">
                Entrar
            </a>

        </p>

    </div>



    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script>

        function mostrarCadastro() {

            document.getElementById("login").style.display = "none";

            document.getElementById("cadastro").style.display = "block";

        }


        function mostrarLogin() {

            document.getElementById("cadastro").style.display = "none";

            document.getElementById("login").style.display = "block";

        }

    </script>

<footer>
    <p>Currículo DEV - Todos os direitos reservados 2026 - TM</p>
</footer>
</body>

</html>
